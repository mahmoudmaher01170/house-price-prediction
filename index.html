
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توقع أسعار العقارات</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
        #result { margin-top: 15px; font-weight: bold; font-size: 18px; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h2>توقع سعر العقار 🏠</h2>
    
    <label>المساحة (قدم مربع):</label>
    <input type="number" id="carpet_area" value="1200">

    <label>رقم الدور:</label>
    <input type="number" id="floor_num" value="2">

    <label>عدد الحمامات:</label>
    <input type="number" id="bathroom" value="2">

    <label>عدد البلكونات:</label>
    <input type="number" id="balcony" value="1">

    <label>أماكن السيارات (Car Parking):</label>
    <input type="number" id="parking" value="1">

    <label>المنطقة:</label>
    <input type="text" id="location" value="Thane West">

    <label>حالة العقار (Status):</label>
    <select id="status">
        <option value="Ready to Move">Ready to Move</option>
        <option value="Under Construction">Under Construction</option>
    </select>

    <label>نوع المعاملة (Transaction):</label>
    <select id="transaction">
        <option value="Resale">Resale</option>
        <option value="New Property">New Property</option>
    </select>

    <label>الفرش (Furnishing):</label>
    <select id="furnishing">
        <option value="Semi-Furnished">Semi-Furnished</option>
        <option value="Unfurnished">Unfurnished</option>
        <option value="Furnished">Furnished</option>
    </select>

    <label>الواجهة (Facing):</label>
    <input type="text" id="facing" value="East">

    <label>الإطلالة (Overlooking):</label>
    <input type="text" id="overlooking" value="Garden/Park">

    <label>الملكية (Ownership):</label>
    <input type="text" id="ownership" value="Freehold">

    <button onclick="getPrediction()">احسب السعر المتوقع</button>

    <div id="result"></div>
</div>

<script>
async function getPrediction() {
    const data = {
        carpet_area_sqft: parseFloat(document.getElementById('carpet_area').value),
        floor_num: parseFloat(document.getElementById('floor_num').value),
        Bathroom: parseFloat(document.getElementById('bathroom').value),
        Balcony: parseFloat(document.getElementById('balcony').value),
        Car_Parking: parseFloat(document.getElementById('parking').value),
        location: document.getElementById('location').value,
        Status: document.getElementById('status').value,
        Transaction: document.getElementById('transaction').value,
        Furnishing: document.getElementById('furnishing').value,
        facing: document.getElementById('facing').value,
        overlooking: document.getElementById('overlooking').value,
        Ownership: document.getElementById('ownership').value
    };

    try {
        const response = await fetch('http://127.0.0.1:8000/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        document.getElementById('result').innerText = "السعر المتوقع: " + result.predicted_price;
    } catch(e) {
        document.getElementById('result').innerText = "تأكد من تشغيل سيرفر FastAPI أولاً!";
    }
}
</script>

</body>
</html>
